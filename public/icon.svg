<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Rounded Base Background -->
  <rect width="512" height="512" rx="112" fill="url(#shieldGrad)" />
  
  <!-- Outer Modern Geometric Hexagon / Shield Accent -->
  <path d="M256 64 L416 144 V272 C416 364 348 436 256 464 C164 436 96 364 96 272 V144 Z" 
        fill="none" stroke="url(#brandGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" opacity="0.3" />
        
  <!-- Center Stylized 'R' + Key / Roof Harmony Mark -->
  <g filter="url(#glow)">
    <!-- Main Stylized 'R' Stem and Arc -->
    <path d="M176 160 H280 C324 160 352 188 352 228 C352 268 324 296 280 296 H176 Z" 
          fill="none" stroke="url(#brandGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="176" y1="160" x2="176" y2="352" stroke="url(#brandGrad)" stroke-width="28" stroke-linecap="round" />
    <!-- Dynamic forward leg morphing into checkmark / arrow of trust -->
    <path d="M260 296 L348 352" stroke="url(#brandGrad)" stroke-width="28" stroke-linecap="round" />
    <!-- Security Core Node (Emerald Dot) -->
    <circle cx="348" cy="228" r="14" fill="#10b981" />
  </g>
</svg>
